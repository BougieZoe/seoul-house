<title>Seoul House</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: full-bleed WebGL scene; HUD pills on the top edge; caption bar for the room tour; one intro card. Dark single look, ondol-amber accent. */
:root {
  --ink: #0d1014;
  --paper: #f2eee4;
  --soft: rgba(242, 238, 228, 0.78);
  --line: rgba(242, 238, 228, 0.22);
  --panel: rgba(13, 16, 20, 0.62);
  --accent: #e9a64d;
  --font-display: "Gowun Batang", "Noto Serif KR", "Songti SC", serif;
  --font-body: "Noto Sans KR", "Noto Sans JP", "Noto Sans SC", "Malgun Gothic", "PingFang SC", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: dark;
}
:root[lang="ja"] { --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Noto Sans KR", system-ui, sans-serif; }
:root[lang="zh-CN"] { --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Noto Sans KR", system-ui, sans-serif; }
:root[lang="en"] { --font-body: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--font-body); -webkit-user-select: none; user-select: none; touch-action: none; }
#app { position: fixed; inset: 0; }
#app canvas { display: block; width: 100%; height: 100%; }
#vig { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.4s; background: radial-gradient(ellipse at center, rgba(235,242,245,0.12) 20%, rgba(225,235,240,0.62) 100%); }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.9s ease; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 1.6rem; color: var(--soft); text-align: center; padding: 0 24px; }
#hud { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
#wx, #tools { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; }
#tools { justify-content: flex-end; align-items: flex-start; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#wx { gap: 8px; }
.ic { appearance: none; position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--soft); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 0; }
.ic[aria-pressed="true"] { color: var(--ink); background: var(--accent); border-color: var(--accent); }
#tools { position: relative; }
#menu { position: absolute; right: 0; top: 52px; min-width: 200px; display: none; flex-direction: column; gap: 2px; padding: 8px; border: 1px solid var(--line); border-radius: 14px; background: rgba(13, 16, 20, 0.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
#menu.on { display: flex; }
#menu .row { appearance: none; border: 0; background: transparent; color: var(--paper); font-family: var(--font-body); font-size: 0.95rem; text-align: left; min-height: 44px; padding: 0 12px; border-radius: 9px; cursor: pointer; }
#menu .row b { font-weight: 500; }
#menu .row[aria-pressed="true"] { background: rgba(233, 166, 77, 0.2); }
#lang { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
#lang button { appearance: none; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--soft); font-family: var(--font-body); font-size: 0.88rem; min-height: 40px; cursor: pointer; }
#lang button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--ink); font-weight: 700; }
.ic:focus-visible, #menu button:focus-visible, #act:focus-visible, .btn:focus-visible, #tourbar button:focus-visible, #lang2 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; background: var(--ink); z-index: 9; line-height: 1.7; color: var(--soft); }
#nogl h2 { font-family: var(--font-display); color: var(--paper); margin: 0 0 10px; font-size: 2rem; }
#toast { position: fixed; left: 50%; top: calc(max(12px, env(safe-area-inset-top, 0px)) + 62px); transform: translate(-50%, -6px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 0.92rem; line-height: 1.45; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); width: max-content; max-width: calc(100% - 32px); text-align: center; }
body.menu-open #toast { opacity: 0 !important; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#prompt { position: fixed; left: 50%; bottom: calc(max(24px, env(safe-area-inset-bottom, 0px)) + 28px); transform: translateX(-50%); display: none; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 16px; font-size: 0.95rem; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none; max-width: calc(100% - 32px); }
#prompt.on { display: flex; }
#prompt kbd { font-family: var(--font-body); font-weight: 700; background: var(--accent); color: var(--ink); border-radius: 6px; padding: 1px 8px; }
#cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255, 255, 255, 0.7); pointer-events: none; }
#joy { position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(max(24px, env(safe-area-inset-bottom, 0px)) + 16px); width: 120px; height: 120px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(242, 238, 228, 0.28); border: 1px solid var(--line); }
#act { position: fixed; right: max(24px, env(safe-area-inset-right, 0px)); bottom: calc(max(24px, env(safe-area-inset-bottom, 0px)) + 28px); min-width: 84px; max-width: 46vw; height: 84px; padding: 0 12px; border-radius: 42px; border: 1px solid var(--accent); background: var(--accent); color: var(--ink); font-family: var(--font-body); font-weight: 700; font-size: 0.86rem; line-height: 1.25; display: none; align-items: center; justify-content: center; text-align: center; }
body.touch #joy { display: block; }
body.touch #act.on { display: flex; }
body.touch #prompt { display: none !important; }
body.touring #joy, body.touring #act, body.touring #prompt, body.touring #cross { display: none !important; }
#tourbar { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 8px); transform: translate(-50%, 12px); width: min(560px, calc(100% - 32px)); box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 12px; display: none; flex-direction: column; gap: 8px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.5s, transform 0.5s; }
body.touring #tourbar { display: flex; }
#tourbar.on { opacity: 1; transform: translate(-50%, 0); }
#tourbar h2 { margin: 0; font-family: var(--font-display); font-size: 1.35rem; line-height: 1.2; }
#tourbar p { margin: 0; color: var(--soft); font-size: 0.92rem; line-height: 1.55; min-height: 2.9em; }
#tourbar .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
#tourbar .dots { display: flex; gap: 5px; }
#tourbar .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
#tourbar .dots i.on { background: var(--accent); }
#tourbar .btns { display: flex; gap: 6px; }
#tourbar button { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--paper); border-radius: 9px; font-family: var(--font-body); font-size: 0.85rem; min-height: 40px; padding: 0 14px; cursor: pointer; }
#tourbar button.primary { background: var(--accent); border-color: var(--accent); color: var(--ink); font-weight: 700; }
#intro { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(13, 16, 20, 0.55), rgba(13, 16, 20, 0.88)); overflow-y: auto; }
#intro .card { max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 14px; margin: auto; }
#intro h1 { margin: 0; font-family: var(--font-display); font-size: clamp(2.6rem, 11vw, 4rem); line-height: 1; letter-spacing: 0.01em; text-wrap: balance; }
#intro h1 span { display: block; font-size: 0.34em; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; margin-top: 10px; font-family: var(--font-body); }
#intro p { margin: 0; color: var(--soft); line-height: 1.65; font-size: 0.95rem; }
#hint { font-size: 0.85rem !important; opacity: 0.8; }
#hint .tc { display: none; } body.touch #hint .pc { display: none; } body.touch #hint .tc { display: inline; }
#lang2 { display: flex; gap: 16px; flex-wrap: wrap; }
#lang2 button { appearance: none; background: none; border: 0; padding: 6px 0; color: var(--soft); font-family: var(--font-body); font-size: 0.85rem; cursor: pointer; border-bottom: 1px solid transparent; }
#lang2 button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
#intro dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 0.86rem; color: var(--soft); }
#intro dt { color: var(--paper); font-weight: 500; }
#intro dd { margin: 0; min-width: 0; }
#intro .cta { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { appearance: none; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 12px; padding: 13px 18px; font-family: var(--font-body); font-weight: 700; font-size: 1rem; cursor: pointer; }
.btn:disabled { opacity: 0.45; cursor: wait; }
.btn.primary { background: var(--accent); color: var(--ink); }
#loading { color: var(--soft); font-size: 0.85rem; }
@media (max-width: 520px) { #wx { gap: 6px; } .ic { width: 42px; height: 42px; } }
@media (prefers-reduced-motion: reduce) { #toast, #vig, #fade, #tourbar { transition: none; } }
</style>

<div id="app"></div>
<div id="vig"></div>
<div id="cross"></div>
<div id="hud">
  <div id="wx" role="group" aria-label="Weather">
    <button type="button" class="ic" data-wx="clear" aria-pressed="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg><span class="sr" data-i18n="wx_clear">Clear</span></button>
    <button type="button" class="ic" data-wx="rain" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15a4.5 4.5 0 1 1 1-8.9A5.5 5.5 0 0 1 18.5 8 3.5 3.5 0 0 1 18 15"/><path d="M8 18l-1 2M12 18l-1 2M16 18l-1 2"/></svg><span class="sr" data-i18n="wx_rain">Rain</span></button>
    <button type="button" class="ic" data-wx="snow" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg><span class="sr" data-i18n="wx_snow">Snow</span></button>
    <button type="button" class="ic" data-night="1" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span class="sr" data-i18n="wx_night">Night</span></button>

    <div id="menu" role="menu">
      <button type="button" class="row" id="tourbtn" aria-pressed="false"><b data-i18n="tour_btn">Tour</b></button>
      <button type="button" class="row" id="mute" aria-pressed="false">Sound on</button>
      <button type="button" class="row" id="qual" aria-pressed="false">Quality: auto</button>

        <button type="button" data-lang="en" aria-pressed="true">English</button><button type="button" data-lang="ko" aria-pressed="false">한국어</button><button type="button" data-lang="zh" aria-pressed="false">中文</button><button type="button" data-lang="ja" aria-pressed="false">日本語</button>
      </div>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>

    <div class="dots" id="tdots" aria-hidden="true"></div>

<div id="intro">
  <div class="card">
